spack:
  specs:
  - phloem+rocm amdgpu_target=gfx942 %c,cxx=cce@20.0.0 ^cray-mpich-gtl
  - cray-mpich-gtl
  view: true
  concretizer:
    unify: true
  packages:
    hsa-rocr-dev:
      externals:
      - spec: hsa-rocr-dev@6.4.3
        prefix: /opt/rocm-6.4.3
    llvm-amdgpu:
      externals:
      - spec: llvm-amdgpu@6.4.3
        prefix: /opt/rocm-6.4.3
        extra_attributes:
          compilers:
            c: /opt/rocm-6.4.3/bin/amdclang
            cxx: /opt/rocm-6.4.3/bin/amdclang++
    cmake:
      externals:
      - spec: cmake@3.29.2
        prefix: /usr/tce/packages/cmake/cmake-3.29.2
    gmake:
      externals:
      - spec: gmake@4.2.1
        prefix: /usr
    hip:
      externals:
      - spec: hip@6.4.3
        prefix: /opt/rocm-6.4.3
    cce:
      externals:
      - spec: cce@20.0.0
        prefix: /opt/cray/pe/cce/20.0.0
        extra_attributes:
          compilers:
            c: /opt/cray/pe/cce/20.0.0/bin/craycc
            cxx: /opt/cray/pe/cce/20.0.0/bin/crayCC
            fortran: /opt/cray/pe/cce/20.0.0/bin/crayftn
    cray-mpich:
      externals:
      - spec: cray-mpich@9.0.1+rocm amdgpu_target=gfx942
        prefix: /opt/cray/pe/mpich/9.0.1/ofi/crayclang/20.0/
