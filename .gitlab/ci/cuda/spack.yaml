spack:
  specs:
  - phloem+cuda
  - openmpi+cuda+internal-pmix+lustre cuda_arch=90 fabrics=cma,ucx schedulers=slurm
  view: true
  concretizer:
    unify: true
  packages:
    zlib:
      externals:
      - spec: zlib@1.2.11
        prefix: /usr
    libtool:
      externals:
      - spec: libtool@2.4.6
        prefix: /usr
    autoconf:
      externals:
      - spec: autoconf@2.69
        prefix: /usr
    slurm:
      externals:
      - spec: slurm@25.05.6
        prefix: /usr
    perl:
      externals:
      - spec: perl@5.26.3+cpanm+opcode+open+shared+threads
        prefix: /usr
    lustre:
      externals:
      - spec: lustre@2.15.7_3.llnl
        prefix: /usr
    hwloc:
      externals:
      - spec: hwloc@2.12.2+cuda
        prefix: /usr
      buildable: False
    gmake:
      externals:
      - spec: gmake@4.2.1
        prefix: /usr
    automake:
      externals:
      - spec: automake@1.16.1
        prefix: /usr
    pkgconf:
      externals:
      - spec: pkgconf@1.4.2
        prefix: /usr
    openssh:
      externals:
      - spec: openssh@8.0p1
        prefix: /usr
    cuda:
      externals:
      - spec: cuda@12.9.86
        prefix: /usr/tce/packages/cuda/cuda-12.9.1
    libevent:
      externals:
      - spec: libevent@2.1.8
        prefix: /usr
    ucx:
      externals:
      - spec: ucx@1.20.0~assertions~backtrace_detail~cma+cuda~dc~debug~dm+examples~gdrcopy~gtest~ib_hw_tm~java~knem~logging~mlx5_dv+openmp+optimizations~parameter_checking+pic~rc~rdmacm~rocm+thread_multiple~ucg~ud~verbs~vfs~xpmem cuda_arch:=none libs:=shared,static opt=3 simd:=auto
        prefix: /usr
      buildable: False
    numactl:
      externals:
      - spec: numactl@2.0.16
        prefix: /usr
    cmake:
      externals:
      - spec: cmake@3.30.5
        prefix: /usr/tce/packages/cmake/cmake-3.30.5
    gcc:
      externals:
      - spec: gcc@13.3.1 languages:='c,c++'
        prefix: /usr/lib64/ccache
        extra_attributes:
          compilers:
            c: /usr/lib64/ccache/gcc
            cxx: /usr/lib64/ccache/g++
      - spec: gcc@13.3.1 languages:='c,c++,fortran'
        prefix: /usr/tce/packages/gcc/gcc-13.3.1
        extra_attributes:
          compilers:
            c: /usr/tce/packages/gcc/gcc-13.3.1/bin/gcc
            cxx: /usr/tce/packages/gcc/gcc-13.3.1/bin/g++
            fortran: /usr/tce/packages/gcc/gcc-13.3.1/bin/gfortran
