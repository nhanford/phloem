spack:
  specs:
  - phloem
  view: true
  concretizer:
    unify: true
  packages:
    gcc:
      externals:
      - spec: gcc@13.3.1 languages:='c,c++,fortran'
        prefix: /usr/tce/packages/gcc/gcc-13.3.1
        extra_attributes:
          compilers:
            c: /usr/tce/packages/gcc/gcc-13.3.1/bin/gcc
            cxx: /usr/tce/packages/gcc/gcc-13.3.1/bin/g++
            fortran: /usr/tce/packages/gcc/gcc-13.3.1/bin/gfortran
    gmake:
      externals:
      - spec: gmake@4.2.1
        prefix: /usr
    cmake:
      externals:
      - spec: cmake@3.26.5
        prefix: /usr
    mvapich2:
      externals:
      - spec: mvapich2@2.3.7~debug+regcache+wrapperrpath ch3_rank_bits=32 fabrics=mrail file_systems=lustre,nfs,ufs process_managers=hydra threads=multiple
        prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-intel-classic-2021.10.0
